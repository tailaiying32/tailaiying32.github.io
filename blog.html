---
layout: default
title: Blog
permalink: /blog/
---
<h1>Blog</h1>

<ul>
	{% for post in site.posts %}
	<li>
		<a href="{{ post.url | relative_url }}">{{ post.title }}</a>
		<span class="meta">&middot; {{ post.date | date: "%B %-d, %Y" }}</span>
	</li>
	{% endfor %}
</ul>

<hr />

<p><a href="{{ '/' | relative_url }}">&larr; back home</a></p>
